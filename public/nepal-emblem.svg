        <g transform="translate(140, 475) scale(1.0)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(150, 560) scale(0.95)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(185, 635) scale(0.9)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(240, 690) scale(0.85)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>

        <g transform="translate(475, 215) scale(0.85)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(545, 255) scale(0.9)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(605, 315) scale(0.95)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(645, 390) scale(1.0)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(660, 475) scale(1.0)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(650, 560) scale(0.95)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
