        <g transform="translate(325, 215) scale(0.85)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(255, 255) scale(0.9)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
        <g transform="translate(195, 315) scale(0.95)"><circle cx="-14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="14" cy="-8" r="15" fill="#d90429" stroke="#800f2f" stroke-width="1.5"/><circle cx="-10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="10" cy="14" r="15" fill="#ef233c" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="-15" r="15" fill="#ff4d6d" stroke="#800f2f" stroke-width="1.5"/><circle cx="0" cy="0" r="16" fill="#c9184a" stroke="#590d22" stroke-width="1.5"/><circle cx="0" cy="0" r="6" fill="#ffb703"/></g>
