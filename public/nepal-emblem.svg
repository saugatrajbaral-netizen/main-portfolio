    <!-- 7. NATIONAL FLAG AT CREST -->
    <g id="crest-flag" transform="translate(400, 160)" filter="url(#emblemShadow)">
      <line x1="-35" y1="5" x2="-35" y2="65" stroke="#6c584c" stroke-width="4" stroke-linecap="round" />
      <polygon points="-35,5 35,28 -10,28 42,65 -35,65" fill="#003893" stroke="#001f3f" stroke-width="2" />
      <polygon points="-30,10 24,28 -15,28 30,59 -30,59" fill="#dc143c" />
      <!-- Upper Moon -->
      <g transform="translate(-16, 23) scale(0.65)" fill="#ffffff">
        <path d="M -8,0 C -8,7 8,7 8,0 C 6,3 -6,3 -8,0 Z" />
        <circle cx="0" cy="0" r="3.5" />
      </g>
      <!-- Lower Sun -->
      <g transform="translate(-14, 46) scale(0.7)" fill="#ffffff">
        <circle cx="0" cy="0" r="4.5" />
        <polygon points="0,-9 2.5,-3.5 -2.5,-3.5" />
        <polygon points="0,9 2.5,3.5 -2.5,3.5" />
        <polygon points="-9,0 -3.5,2.5 -3.5,-2.5" />
        <polygon points="9,0 3.5,2.5 3.5,-2.5" />
        <polygon points="-6.5,-6.5 -2,-3.5 -4.5,-1" />
        <polygon points="6.5,6.5 2,3.5 4.5,1" />
        <polygon points="-6.5,6.5 -3.5,2 -1,4.5" />
        <polygon points="6.5,-6.5 3.5,-2 1,-4.5" />
      </g>
    </g>

    <!-- 8. BASE MOTTO BANNER -->
    <g id="motto-ribbon" transform="translate(400, 720)" filter="url(#emblemShadow)">
      <polygon points="-330,-10 -370,-45 -345,-55 -300,-20" fill="#590d22" />
      <polygon points="330,-10 370,-45 345,-55 300,-20" fill="#590d22" />
      <path
        d="M -320,-30 
           Q 0,-65 320,-30 
           L 295,30 
           Q 0,-5 -295,30 
           Z"
        fill="url(#govRibbonGrad)"
        stroke="#ffb703"
        stroke-width="3"
      />
      <text
        x="0"
        y="5"
        text-anchor="middle"
        fill="#ffffff"
        font-family="'Inter', 'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif"
        font-weight="900"
        font-size="26"
        letter-spacing="1.5"
